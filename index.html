<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umit Bozdag - Event Operations</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #08080e; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
    .overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 2; pointer-events: none;
      padding: 20px;
    }
    .brand {
      display: flex; align-items: center; gap: 14px;
      position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
    }
    .brand-line {
      width: 40px; height: 1px; background: linear-gradient(90deg, transparent, rgba(212,175,55,0.5), transparent);
    }
    .brand-text {
      color: rgba(212,175,55,0.6);
      font-size: 0.65rem; letter-spacing: 6px; text-transform: uppercase;
    }
    .hero {
      text-align: center;
    }
    .hero-sub {
      color: rgba(212,175,55,0.5);
      font-size: 0.7rem; letter-spacing: 10px; text-transform: uppercase;
      margin-bottom: 20px;
      animation: fadeSlide 1.2s ease-out;
    }
    .hero h1 {
      color: #fff;
      font-size: 5.5rem; font-weight: 100; letter-spacing: 8px;
      line-height: 1.1;
      text-shadow: 0 0 40px rgba(212,175,55,0.15);
    }
    .hero h1 .gold {
      font-weight: 700;
      background: linear-gradient(135deg, #d4af37, #f5d76e, #d4af37);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero h1 .thin { font-weight: 100; color: rgba(255,255,255,0.9); }
    .hero-divider {
      width: 60px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212,175,55,0.6), transparent);
      margin: 24px auto;
      animation: fadeSlide 1.4s ease-out;
    }
    .hero-title {
      color: rgba(255,255,255,0.35);
      font-size: 0.85rem; letter-spacing: 8px; text-transform: uppercase;
      animation: fadeSlide 1.6s ease-out;
    }
    .grid {
      display: flex; gap: 50px;
      margin-top: 50px;
      animation: fadeSlide 1.8s ease-out;
    }
    .grid-item {
      text-align: center;
    }
    .grid-item .icon {
      font-size: 1.4rem; margin-bottom: 8px;
      filter: drop-shadow(0 0 6px rgba(212,175,55,0.2));
    }
    .grid-item .label {
      color: rgba(255,255,255,0.25);
      font-size: 0.65rem; letter-spacing: 4px; text-transform: uppercase;
    }
    .footer {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 16px;
      animation: fadeSlide 2s ease-out;
    }
    .footer-dot {
      width: 4px; height: 4px; border-radius: 50%; background: rgba(212,175,55,0.3);
    }
    .footer-text {
      color: rgba(255,255,255,0.12);
      font-size: 0.6rem; letter-spacing: 4px; text-transform: uppercase;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="overlay">
    <div class="brand">
      <div class="brand-line"></div>
      <span class="brand-text">Event Operations</span>
      <div class="brand-line"></div>
    </div>

    <div class="hero">
      <div class="hero-sub">Coming Soon</div>
      <h1><span class="thin">Umit</span> <span class="gold">Bozdag</span></h1>
      <div class="hero-divider"></div>
      <div class="hero-title">Event Operations Management</div>
      <div class="grid">
        <div class="grid-item">
          <div class="icon">&#9679;</div>
          <div class="label">Planning</div>
        </div>
        <div class="grid-item">
          <div class="icon">&#9670;</div>
          <div class="label">Logistics</div>
        </div>
        <div class="grid-item">
          <div class="icon">&#9641;</div>
          <div class="label">Production</div>
        </div>
        <div class="grid-item">
          <div class="icon">&#9733;</div>
          <div class="label">Execution</div>
        </div>
      </div>
    </div>

    <div class="footer">
      <span class="footer-text">Launching Soon</span>
      <span class="footer-dot"></span>
      <span class="footer-text">Events Redefined</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const COLORS = {
      gold: { h: 43, s: 85, l: 55 },
      rose: { h: 340, s: 70, l: 55 },
      navy: { h: 225, s: 50, l: 35 },
      white: { h: 45, s: 10, l: 90 },
      teal: { h: 175, s: 60, l: 45 }
    };
    const COLOR_KEYS = ['gold', 'rose', 'navy', 'white', 'teal'];

    const CONFETTI_COUNT = 350;
    const confetti = [];

    for (let i = 0; i < CONFETTI_COUNT; i++) {
      const key = COLOR_KEYS[Math.floor(Math.random() * COLOR_KEYS.length)];
      const c = COLORS[key];
      confetti.push({
        x: Math.random() * W,
        y: Math.random() * H,
        z: Math.random() * 4 + 0.3,
        size: Math.random() * 3 + 0.5,
        h: c.h + (Math.random() - 0.5) * 15,
        s: c.s + (Math.random() - 0.5) * 10,
        l: c.l + (Math.random() - 0.5) * 15,
        driftX: (Math.random() - 0.5) * 0.3,
        driftY: Math.random() * 0.15 + 0.05,
        spin: (Math.random() - 0.5) * 0.02,
        angle: Math.random() * Math.PI * 2,
        wobble: Math.random() * 0.03 + 0.01,
        wobbleSpeed: Math.random() * 0.02 + 0.005,
        shape: Math.random() < 0.3 ? 'rect' : 'circle'
      });
    }

    const mouse = { x: -9999, y: -9999, vx: 0, vy: 0 };
    let prevMX = -9999, prevMY = -9999;
    const trail = [];

    // Spotlight ring
    const rings = [];
    for (let i = 0; i < 3; i++) {
      rings.push({ angle: Math.random() * Math.PI * 2, speed: (0.2 + Math.random() * 0.3) * (i % 2 === 0 ? 1 : -1), radius: 0 });
    }

    document.addEventListener('mousemove', (e) => {
      mouse.vx = e.clientX - prevMX;
      mouse.vy = e.clientY - prevMY;
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      prevMX = e.clientX;
      prevMY = e.clientY;

      const spd = Math.sqrt(mouse.vx * mouse.vx + mouse.vy * mouse.vy);
      if (spd > 1) {
        const n = Math.min(8, Math.floor(spd / 3) + 2);
        for (let i = 0; i < n; i++) {
          const key = COLOR_KEYS[Math.floor(Math.random() * COLOR_KEYS.length)];
          const c = COLORS[key];
          trail.push({
            x: mouse.x + (Math.random() - 0.5) * 24,
            y: mouse.y + (Math.random() - 0.5) * 24,
            life: 1,
            size: Math.random() * 6 + 2,
            h: c.h + (Math.random() - 0.5) * 15,
            s: c.s,
            l: c.l + 15
          });
        }
      }
    });

    document.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

    let time = 0;

    function drawSpotlight(cx, cy) {
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 300);
      grad.addColorStop(0, 'rgba(212, 175, 55, 0.025)');
      grad.addColorStop(0.4, 'rgba(212, 175, 55, 0.01)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
    }

    function drawRings(cx, cy) {
      for (const ring of rings) {
        ring.angle += ring.speed * 0.015;
        const offsetX = Math.cos(ring.angle) * 8;
        const offsetY = Math.sin(ring.angle * 0.7) * 5;
        const rx = cx + offsetX;
        const ry = cy + offsetY;

        ctx.beginPath();
        ctx.ellipse(rx, ry, 60 + ring.radius * 0.3, 20 + ring.radius * 0.1, ring.angle * 0.3, 0, Math.PI * 2);
        ctx.strokeStyle = `hsla(43, 80%, 55%, ${0.06 + ring.radius * 0.002})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    function drawStageLight() {
      const g1 = ctx.createRadialGradient(W * 0.5, H * 0.3, 0, W * 0.5, H * 0.3, W * 0.7);
      g1.addColorStop(0, 'rgba(212, 175, 55, 0.02)');
      g1.addColorStop(0.3, 'rgba(180, 100, 60, 0.008)');
      g1.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = g1;
      ctx.fillRect(0, 0, W, H);

      if (mouse.x > 0) {
        const g2 = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 350);
        g2.addColorStop(0, 'rgba(212, 175, 55, 0.03)');
        g2.addColorStop(0.5, 'rgba(212, 175, 55, 0.008)');
        g2.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = g2;
        ctx.fillRect(0, 0, W, H);
      }
    }

    function drawConfetti() {
      const spd = Math.sqrt(mouse.vx * mouse.vx + mouse.vy * mouse.vy);

      for (const p of confetti) {
        p.angle += p.spin + p.wobble * Math.sin(time * p.wobbleSpeed);

        const dx = p.x - mouse.x;
        const dy = p.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        let fx = 0, fy = 0;
        if (dist < 200 && dist > 0 && mouse.x > 0) {
          const f = (1 - dist / 200) * 15;
          fx = (dx / dist) * f;
          fy = (dy / dist) * f;
        }

        p.x += p.driftX + fx * 0.04;
        p.y += p.driftY + fy * 0.04;

        if (p.x < -10) p.x = W + 10;
        if (p.x > W + 10) p.x = -10;
        if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
        if (p.y > H + 10) { p.y = -10; p.x = Math.random() * W; }

        const alpha = Math.min(1, p.z / 4 + 0.3) * 0.7;

        ctx.shadowBlur = p.size * 3;
        ctx.shadowColor = `hsla(${p.h}, ${p.s}%, ${p.l}%, ${alpha * 0.2})`;

        if (p.shape === 'rect') {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);
          ctx.fillStyle = `hsla(${p.h}, ${p.s}%, ${p.l}%, ${alpha})`;
          ctx.fillRect(-p.size * 0.8, -p.size * 0.3, p.size * 1.6, p.size * 0.6);
          ctx.restore();
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * 0.7, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${p.h}, ${p.s}%, ${p.l}%, ${alpha})`;
          ctx.fill();
        }

        ctx.shadowBlur = 0;
      }
    }

    function drawTrail() {
      const spd = Math.sqrt(mouse.vx * mouse.vx + mouse.vy * mouse.vy);

      if (spd > 0.5) {
        const n = spd > 5 ? 2 : 1;
        for (let j = 0; j < n; j++) {
          const key = COLOR_KEYS[Math.floor(Math.random() * COLOR_KEYS.length)];
          const c = COLORS[key];
          trail.push({
            x: mouse.x + (Math.random() - 0.5) * 14,
            y: mouse.y + (Math.random() - 0.5) * 14,
            life: 1,
            size: Math.random() * 5 + 1.5,
            h: c.h + (Math.random() - 0.5) * 20,
            s: c.s,
            l: c.l + 20
          });
        }
      }

      for (let i = trail.length - 1; i >= 0; i--) {
        const p = trail[i];
        p.life -= 0.018;
        if (p.life <= 0) { trail.splice(i, 1); continue; }

        const a = p.life * 0.45;
        ctx.shadowBlur = p.size * 8;
        ctx.shadowColor = `hsla(${p.h}, ${p.s}%, ${p.l}%, ${a * 0.3})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${p.h}, ${p.s}%, ${p.l}%, ${a})`;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      if (trail.length > 400) trail.splice(0, trail.length - 400);
    }

    function draw() {
      ctx.fillStyle = 'rgba(8, 8, 14, 0.2)';
      ctx.fillRect(0, 0, W, H);

      drawStageLight();

      if (mouse.x > 0) {
        drawSpotlight(mouse.x, mouse.y);
        drawRings(mouse.x, mouse.y);
      }

      drawConfetti();
      drawTrail();

      time++;
      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
